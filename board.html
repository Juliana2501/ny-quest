<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Табло: Новый год под угрозой</title>
<style>
:root{--gold:#ffd166;--red:#e63946;--snow:#f4f9ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1d4175,#0b1d3a 70%);color:var(--snow);font:20px/1.4 "Trebuchet MS",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 24px 50px;position:relative;z-index:2}
h1,h2,.big{font-family:Georgia,serif}
h1{color:var(--gold);font-size:38px;margin:0 0 6px}
.cd{font:bold 110px Georgia,serif;text-align:center;color:var(--gold);margin:6px 0;text-shadow:0 0 30px #ffd16688}
.sub{text-align:center;font-size:24px}
.row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;align-items:center}
input,button{font:inherit;padding:12px 16px;border-radius:12px;border:2px solid #3b5f95;background:#0f2a50;color:var(--snow)}
input{flex:1;min-width:240px}
button{cursor:pointer}
button:hover,button:focus-visible,input:focus{border-color:var(--gold);outline:none}
button.go{background:var(--red);border-color:var(--red);font-weight:bold}
.hero{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;margin:18px 0 26px;padding:28px;border-radius:28px;background:linear-gradient(145deg,#12315c,#0d2347);border:2px solid #3b5f95;box-shadow:0 0 50px #ffd16622}
.qrcard{text-align:center}
.qr{display:inline-block;background:#fff;padding:18px;border-radius:22px;line-height:0;box-shadow:0 0 0 6px var(--gold),0 0 40px #ffd16688}
.tiny{margin-top:16px;font-size:13px;opacity:.55;word-break:break-all;max-width:300px}
.herotxt{max-width:460px}
.herotxt h2{font-size:40px;color:var(--gold);margin:0 0 12px;line-height:1.15}
.herotxt p{font-size:22px;margin:0}
#conn{font-size:16px;opacity:.85}
#msg{min-height:26px;color:#ff9aa2}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #2c4d80;vertical-align:top}
th{color:var(--gold);font-family:Georgia,serif}
td.pl{white-space:nowrap}
td button{padding:2px 9px;font-size:14px}
.stage{position:fixed;inset:0;z-index:5;background:radial-gradient(circle at 50% 30%,#1d4175,#0b1d3a 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;overflow:auto}
.stage .ico{font-size:110px;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.stage h2{font-size:46px;color:var(--gold);margin:10px 0}
.stage .big{font-size:84px;font-weight:bold;animation:pop 1s .5s cubic-bezier(.2,1.6,.4,1) both}
.stage .stat{font-size:28px;max-width:800px;animation:pop 1s 1.2s both}
.stage .hint{position:absolute;bottom:18px;opacity:.6;font-size:16px}
.stage table{max-width:980px;font-size:20px;text-align:left}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.flake{position:fixed;top:-20px;color:#fff;opacity:.8;animation:fall linear infinite;pointer-events:none;z-index:6}
@keyframes fall{to{transform:translateY(110vh)}}
@media (prefers-reduced-motion:reduce){.flake{display:none}.stage *{animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>🎄 Операция «Новый год под угрозой»</h1>
  <div class="sub">До оглашения результатов:</div>
  <div class="cd" id="cd">03:00</div>
  <div class="row" style="justify-content:center">
    <button id="bt">Запустить таймер</button>
    <button class="go" id="bc">Начать церемонию сейчас</button>
  </div>
  <section class="hero">
    <div class="qrcard"><div id="qr" class="qr"></div><div class="tiny" id="lk"></div></div>
    <div class="herotxt">
      <h2>Наведи камеру телефона на код</h2>
      <p>Откроется квест, ничего устанавливать не нужно. Ответь на вопросы, и твой результат сам появится на этом экране.</p>
    </div>
  </section>
  <h2>Рейтинг: прошли <span id="n">0</span></h2>
  <table id="tb"></table>
  <details style="margin-top:20px"><summary>Запасной ввод кода вручную</summary>
    <div class="row"><input id="in" placeholder="Вставьте запасной код с телефона" autocomplete="off"><button id="ad">Добавить</button></div>
    <div id="msg"></div>
  </details>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const FINAL="А подарок был в сугробе. Дело закрыто. С Новым годом!";
// Плашки раздаются по порядку: каждая достаётся лучшему из тех, кто ещё без плашки.
// Функция возвращает оценку (больше — лучше) или null, если плашка не подходит никому.
const AW=[
["🏆","Лучший детектив",r=>r.ok*10000-r.secs],
["⚡","Самый быстрый",r=>-r.secs],
["😂","Самый смешной",r=>r.fun*10000-r.secs],
["🔍","Верный исход",r=>r.win?r.ok*10000-r.secs:null],
["🐢","Самый вдумчивый",r=>r.secs],
["🕊️","Мастер дипломатии",r=>r.n*10000-r.secs],
["🎯","Золотая середина",(r,m)=>-Math.abs(r.secs-m)],
["🧐","Самый серьёзный",r=>-r.fun*10000+r.ok],
["🎲","Непредсказуемый",r=>-Math.abs(r.ok-r.fun)*10000-r.secs]
];
const KEY="quest_results2",BAN="quest_ban2";
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let R=ld(KEY,"[]"),banned=ld(BAN,"[]");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// комната
let room=new URLSearchParams(location.search).get("room")||ld("quest_room",'""');
if(!room){room=Math.random().toString(36).slice(2,8)}
sv("quest_room",room);
history.replaceState(null,"","?room="+room);
// Адрес квеста: если табло открыто с сайта, берём его, иначе адрес GitHub Pages
const SITE="https://juliana2501.github.io/ny-quest/";
const here=location.protocol.startsWith("http")&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const joinUrl=new URL("index.html?room="+room,here?location.href:SITE).href;
$("lk").textContent=joinUrl.replace(/^https?:\/\//,"");
try{new QRCode($("qr"),{text:joinUrl,width:280,height:280,correctLevel:QRCode.CorrectLevel.L})}catch(e){$("qr").style.display="none"}

function assign(){
  const secs=R.map(r=>r.secs).sort((a,b)=>a-b),m=secs.length?secs[Math.floor(secs.length/2)]:0;
  const left=R.slice(),out=new Map(),order=[];
  for(const [ic,t,f] of AW){
    if(!left.length)break;
    let best=null,bs=-Infinity;
    for(const r of left){const s=f(r,m);if(s!==null&&s>bs){bs=s;best=r}}
    if(best){out.set(best.name,[ic,t]);order.push(best);left.splice(left.indexOf(best),1)}
  }
  left.forEach(r=>{out.set(r.name,["🎖️","Почётный детектив"]);order.push(r)});
  return {out,order};
}

function render(){
  $("n").textContent=R.length;
  const {out,order}=assign();
  $("tb").innerHTML=`<tr><th>Участник</th><th>Плашка</th><th>Исход истории</th><th></th></tr>`+
    order.map(r=>{const a=out.get(r.name);return `<tr><td>${esc(r.name)}</td><td class="pl">${a[0]} ${a[1]}</td><td>${esc(r.text)}</td><td><button data-n="${esc(r.name)}" title="Удалить">✕</button></td></tr>`}).join("");
  $("tb").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    banned.push(b.dataset.n.toLowerCase());sv(BAN,banned);
    R=R.filter(r=>r.name!==b.dataset.n);sv(KEY,R);render();
  });
}

function addResult(p){
  if(!p||typeof p.name!=="string"||!p.name.trim())return false;
  const n=x=>Math.max(0,Math.min(99999,Math.round(+x)||0));
  const r={name:p.name.trim().slice(0,20),ok:n(p.ok),fun:n(p.fun),n:n(p.n),secs:n(p.secs),win:!!p.win,text:String(p.text||"").slice(0,300)};
  if(banned.includes(r.name.toLowerCase()))return false;
  R=R.filter(x=>x.name.toLowerCase()!==r.name.toLowerCase());R.push(r);
  sv(KEY,R);render();return true;
}
function parse(s){
  try{return JSON.parse(s)}catch(e){}
  try{return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}catch(e){}
  return null;
}

// приём результатов с телефонов
function connect(){
  const es=new EventSource("https://ntfy.sh/ny-quest-"+encodeURIComponent(room)+"/sse?since=all");
  es.onopen=()=>{$("conn").textContent="● на связи, результаты приходят сами"};
  es.onerror=()=>{$("conn").textContent="● нет связи, пробую переподключиться…"};
  es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="message")addResult(parse(m.message))}catch(x){}};
}
connect();

// ручной ввод
function manual(){
  if(addResult(parse($("in").value))){$("in").value="";$("msg").textContent=""}
  else $("msg").textContent="Код не распознан";
}
$("ad").onclick=manual;
$("in").onkeydown=e=>{if(e.key==="Enter")manual()};

// таймер
let left=180,cdT=null;
function showCd(){$("cd").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}
$("bt").onclick=()=>{
  if(cdT){clearInterval(cdT);cdT=null;$("bt").textContent="Продолжить таймер";return}
  $("bt").textContent="Пауза";
  cdT=setInterval(()=>{left--;showCd();if(left<=0){clearInterval(cdT);cdT=null;ceremony()}},1000);
};

// церемония: у каждого участника свой экран с плашкой
function ceremony(){
  if(!R.length)return;
  const {out,order}=assign();
  const st=document.createElement("div");st.className="stage";document.body.appendChild(st);
  let s=0;
  const close=()=>{st.remove();document.removeEventListener("keydown",key)};
  function draw(){
    if(s<order.length){
      const r=order[s],a=out.get(r.name);
      st.innerHTML=`<div class="ico">${a[0]}</div><h2>${a[1]}</h2><div class="big">${esc(r.name)}</div><div class="stat">${esc(r.text)}</div><div class="hint">Далее: пробел или клик. Выход: Esc</div>`;
    }else{
      st.innerHTML=`<div class="ico">🎄</div><h2>Все награды вручены</h2><table>`+
      order.map(r=>{const a=out.get(r.name);return `<tr><td>${esc(r.name)}</td><td class="pl">${a[0]} ${a[1]}</td></tr>`}).join("")+
      `</table><h2 style="margin-top:24px">${FINAL}</h2><div class="hint">Esc, чтобы закрыть</div>`;
    }
  }
  const next=()=>{if(s<order.length){s++;draw()}};
  function key(e){if(e.key==="Escape")close();else if([" ","Enter","ArrowRight"].includes(e.key)){e.preventDefault();next()}}
  st.onclick=next;document.addEventListener("keydown",key);draw();
}
$("bc").onclick=ceremony;

for(let n=0;n<30;n++){const f=document.createElement("span");f.className="flake";f.textContent="❄";
  f.style.left=Math.random()*100+"vw";f.style.fontSize=12+Math.random()*20+"px";
  f.style.animationDuration=8+Math.random()*10+"s";f.style.animationDelay=-Math.random()*15+"s";document.body.appendChild(f)}
render();
</script>
</body>
</html>
